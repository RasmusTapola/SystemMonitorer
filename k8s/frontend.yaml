apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-frontend
  namespace: system-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-frontend
  template:
    metadata:
      labels:
        app: monitor-frontend
    spec:
      containers:
        - name: frontend
          image: systemmonitor-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-frontend
  namespace: system-monitor
spec:
  selector:
    app: monitor-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer