apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-api
  namespace: system-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-api
  template:
    metadata:
      labels:
        app: monitor-api
    spec:
      containers:
        - name: api
          image: systemmonitor-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: systemmonitor
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-api
  namespace: system-monitor
spec:
  selector:
    app: monitor-api
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer